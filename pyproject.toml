[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apcnet"
dynamic = ["version"]
description = "APCNet"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "AGPL-3.0" }
keywords = ["APCNet", "YOLO"]
dependencies = [
  "numpy>=1.23.0",
  "opencv-python>=4.6.0",
  "pillow>=7.1.2",
  "pyyaml>=5.3.1",
  "requests>=2.23.0",
  "scipy>=1.4.1",
  "torch>=1.8.0",
  "torchvision>=0.9.0",
  "tqdm>=4.64.0",
  "psutil",
  "py-cpuinfo",
  "matplotlib>=3.3.0",
  "seaborn>=0.11.0",
  "pandas>=1.1.4",
  "ultralytics-thop>=2.0.0",
  "einops>=0.6.0",
]

[project.scripts]
yolo = "ultralytics.cfg:entrypoint"
ultralytics = "ultralytics.cfg:entrypoint"

[tool.setuptools]
packages = { find = { where = ["."], include = ["ultralytics", "ultralytics.*"] } }
package-data = { "ultralytics" = ["**/*.yaml"] }

[tool.setuptools.dynamic]
version = { attr = "ultralytics.__version__" }
